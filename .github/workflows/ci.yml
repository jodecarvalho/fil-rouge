name: CI Fil Rouge

on:
  push:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Dire bonjour
        run: echo "Bonjour depuis mon pipeline CI GitHub Actions !"

      - name: Configurer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Vérifier la version de Java
        run: java -version

      - name: Vérifier la version de Maven
        run: mvn -version